name: service-tracker-frontend

services:

  # ── React / Vite Front-End ──────────────────────────────────────────────────
  servicetracker.web:
    image: ${DOCKER_REGISTRY-}servicetrackerwebui
    build:
      context: ./ServiceTracker.Web
      dockerfile: Dockerfile
      args:
        # VITE_API_URL is baked into the JS bundle at build time.
        # Set to the full API base URL, e.g. https://api.example.com/api
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: service-tracker-web
    restart: unless-stopped
    ports:
      - "3000:80"