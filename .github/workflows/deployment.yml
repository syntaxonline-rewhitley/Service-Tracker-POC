# Deploy ServiceTracker Stack
#
# Required GitHub repository secrets:
#   DEPLOY_HOST       - Server IP or hostname (e.g. 192.168.1.10)
#   DEPLOY_USER       - SSH username on the server
#   DEPLOY_SSH_KEY    - SSH private key (PEM format) for passwordless auth
#   DEPLOY_PATH       - Absolute path to the repository root on the server
#   GHCR_USER         - GitHub username / org that owns the packages
#   GHCR_TOKEN        - GitHub PAT with read:packages scope (for server pull)
#   VERCEL_DEPLOY_HOOK - Vercel deploy hook URL (Project Settings → Git → Deploy Hooks)
#   POSTGRES_USER     - PostgreSQL username
#   POSTGRES_PASSWORD - PostgreSQL password
#   RABBITMQ_USER     - RabbitMQ username
#   RABBITMQ_PASSWORD - RabbitMQ password
#   PGADMIN_EMAIL     - pgAdmin login email
#   PGADMIN_PASSWORD  - pgAdmin login password
#   API_URL           - Backend base URL passed to nginx at runtime, e.g. http://servicetracker.api:8080
name: Deploy ServiceTracker Stack

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. Run .NET tests ──────────────────────────────────────────────────────
  test:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "src/Service Tracker POC.sln"

      - name: Build
        run: dotnet build "src/Service Tracker POC.sln" --no-restore -c Release

      - name: Test
        run: dotnet test "src/Service Tracker POC.sln" --no-build -c Release --verbosity normal

  # ── 2. Build images and push to ghcr.io ───────────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: src/ServiceTracker.Api
          file: src/ServiceTracker.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/servicetrackerapi:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web UI
        uses: docker/build-push-action@v6
        with:
          context: src/ServiceTracker.Web
          file: src/ServiceTracker.Web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/servicetrackerweb:${{ steps.tag.outputs.value }}
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── 3. Deploy to VPS via SSH ──────────────────────────────────
  deploy-to-ssh:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail            
            ansible-deploy servicetrack/deploy.yml


