name: service-tracker-frontend

services:

  # ── React / Vite Front-End ──────────────────────────────────────────────────
  servicetracker.web:
    image: ${DOCKER_REGISTRY-}servicetrackerwebui
    build:
      context: ./Web
      dockerfile: Dockerfile
    container_name: service-tracker-web
    restart: unless-stopped
    ports:
      - "3000:80"    
    environment:
      # nginx substitutes ${API_URL} at startup — set to backend base URL,
      # e.g. http://servicetracker.api:8080 or https://api.example.com
      - API_URL=${API_URL:-http://localhost:8080}